networks:
  internal:
    internal: true
  external:
  downloading_internal:
    external: true
    
services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    environment:
      - PUID=99
      - PGID=100
      - UMASK=000
      - TZ=America/Chicago
      - PIXELFLUX_WAYLAND=true
      - DRINODE=/dev/dri/renderD128
      - DRI_NODE=/dev/dri/renderD128
    volumes:
      - /mnt/user/appdata/calibre/calibre:/config
      - /mnt/user/media:/data
    devices:
      - /dev/dri:/dev/dri
    networks:
      - internal
      - external
      - downloading_internal
    ports:
      - 9080:8080
      - 9181:8181
      - 9081:8081
    shm_size: "1gb"
    restart: unless-stopped
    
  calibreweb:
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      - PUID=99
      - PGID=100
      - UMASK=000
      - TZ=America/Chicago
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - /mnt/user/appdata/calibre/calibre-web:/config
      - /mnt/user/media/Books:/books
    networks:
      - internal
      - external
    ports:
      - 8083:8083
    depends_on:
      - calibre
    restart: unless-stopped
